<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OpenMakruk — แพลตฟอร์มหมากรุกไทย single-player ที่ดีที่สุด · เล่นกับ bot ที่ฉลาด · ฝึกจากทุกตาเดิน · ท้าเพื่อนผ่าน challenge เดียวกัน (bot-mediated competition) · 22 bot characters · counting · pattern · survive · ฟรี" />
    <meta name="theme-color" content="#1a1816" />

    <!-- OpenGraph / share previews. Used when a deep link like
         openmakruk.com/#/puzzles/mate-001 is pasted into Line / Facebook
         / Twitter / Discord. Hash fragments aren't sent to crawlers, so
         every deep link picks up these same site-level defaults — the
         landing page handles the routing in JS once the user clicks. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenMakruk" />
    <meta property="og:title" content="OpenMakruk · The best single-player Makruk platform" />
    <meta property="og:description" content="Play intelligent bots · learn from every move · compete through shared bot challenges. 22 bot characters · counting · pattern · survive · ฟรี ไม่ต้องสมัคร · เล่นออฟไลน์ได้" />
    <meta property="og:url" content="https://openmakruk.com" />
    <!-- PNG as primary because LINE / Facebook share-preview crawlers
         drop SVG silently. The SVG ships too (sharper on Twitter +
         high-DPI displays that respect og:image:type). -->
    <meta property="og:image" content="https://openmakruk.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenMakruk · เว็บฝึก / เล่น / วิเคราะห์ หมากรุกไทย" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X uses its own card metadata; `summary_large_image`
         renders the 1200x630 above as the hero. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenMakruk · หมากรุกไทย open-source" />
    <meta name="twitter:description" content="เล่นหมากรุกไทยกับ Fairy-Stockfish · ฝึก · ปริศนา · ไม่ต้องสมัคร" />
    <meta name="twitter:image" content="https://openmakruk.com/og.png" />

    <!-- PWA wiring -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Boot splash CSS — separate file (no inline <style>) so the
         CSP `style-src` directive stays free of 'unsafe-inline'. The
         file is in /public so it serves at a stable URL the browser
         caches aggressively. -->
    <link rel="stylesheet" href="/splash.css" />

    <!-- Canonical so search engines collapse `/#/<anything>` variants. -->
    <link rel="canonical" href="https://openmakruk.com" />

    <title>OpenMakruk · หมากรุกไทย</title>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React boot splash. React replaces this on mount; until
           then the user sees something other than a blank page during
           IndexedDB hydration + JS chunk load. Styled by /splash.css —
           NO inline style attributes here (CSP). -->
      <div class="openmakruk-boot">
        <div class="openmakruk-boot-spinner" aria-hidden="true"></div>
        <div class="openmakruk-boot-label">กำลังโหลด OpenMakruk…</div>
      </div>
    </div>
    <!-- SW registration was previously an inline <script> here. Moved
         to src/main.tsx::registerServiceWorker() to satisfy CSP
         script-src 'self' (no 'unsafe-inline'). -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
