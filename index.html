<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OpenMakruk — แพลตฟอร์ม single-player ที่ดีที่สุดสำหรับฝึกหมากรุกไทย · 22 bot characters · counting drill · pattern · survive · boss rush · ฟรี ไม่ต้องสมัคร" />
    <meta name="theme-color" content="#1a1816" />

    <!-- OpenGraph / share previews. Used when a deep link like
         openmakruk.com/#/puzzles/mate-001 is pasted into Line / Facebook
         / Twitter / Discord. Hash fragments aren't sent to crawlers, so
         every deep link picks up these same site-level defaults — the
         landing page handles the routing in JS once the user clicks. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenMakruk" />
    <meta property="og:title" content="OpenMakruk · Best single-player Makruk training" />
    <meta property="og:description" content="22 bot characters · counting drill · pattern · survive · boss rush · ฟรี ไม่ต้องสมัคร · เล่นออฟไลน์ได้" />
    <meta property="og:url" content="https://openmakruk.com" />
    <!-- PNG as primary because LINE / Facebook share-preview crawlers
         drop SVG silently. The SVG ships too (sharper on Twitter +
         high-DPI displays that respect og:image:type). -->
    <meta property="og:image" content="https://openmakruk.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenMakruk · เว็บฝึก / เล่น / วิเคราะห์ หมากรุกไทย" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X uses its own card metadata; `summary_large_image`
         renders the 1200x630 above as the hero. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenMakruk · หมากรุกไทย open-source" />
    <meta name="twitter:description" content="เล่นหมากรุกไทยกับ Fairy-Stockfish · ฝึก · ปริศนา · ไม่ต้องสมัคร" />
    <meta name="twitter:image" content="https://openmakruk.com/og.png" />

    <!-- PWA wiring -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Canonical so search engines collapse `/#/<anything>` variants. -->
    <link rel="canonical" href="https://openmakruk.com" />

    <title>OpenMakruk · หมากรุกไทย</title>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React boot splash. React replaces this on mount; until
           then the user sees something other than a blank page during
           IndexedDB hydration + JS chunk load. Critical CSS inline so
           the splash works before the stylesheet downloads. -->
      <div style="
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.8rem;
        background: #1a1816; color: rgba(255,255,255,0.75);
        font-family: -apple-system, system-ui, sans-serif;">
        <div style="
          width: 36px; height: 36px;
          border: 3px solid rgba(255,255,255,0.15);
          border-top-color: #d4a23c;
          border-radius: 50%;
          animation: openmakruk-spin 0.9s linear infinite;"></div>
        <div style="font-size: 0.9rem;">กำลังโหลด OpenMakruk…</div>
        <style>@keyframes openmakruk-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker once the page is loaded so the
      // initial render isn't blocked. Skipped in dev to avoid stale
      // cache issues — sw.js still ships in prod via /public/.
      if ('serviceWorker' in navigator && !location.hostname.includes('localhost') && !location.hostname.includes('127.0.0.1')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
