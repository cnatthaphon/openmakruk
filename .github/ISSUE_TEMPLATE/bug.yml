name: Bug
description: A reproducible defect in gameplay, UI, storage, API, or deployment.
title: 'Bug: '
labels: ['bug', 'needs-triage']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Play / board
        - Review / analysis
        - Puzzle / training
        - Lessons / journey
        - Challenge / leaderboard
        - Custom / library
        - Settings / profile
        - Worker / API
        - Deployment / PWA
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshot, video, console error, failing test, or affected URL.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Bug is fixed.
        - [ ] Regression test added or updated.
        - [ ] No unrelated UI/layout changes.
    validations:
      required: true
