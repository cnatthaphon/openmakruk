# Quality gate for every PR + push to main.
#
# Why this job, not 3 separate ones: typecheck/build/e2e share the same
# install + setup, so doing them in one workflow keeps minutes low. The
# build step also produces dist/ that we could deploy from later (Pages,
# Cloudflare) without re-running the suite.
#
# Notes:
#   - Cache `~/.npm` keyed by package-lock.json hash for fast installs.
#   - `npm ci` (not install) — reproducible builds from the lockfile.
#   - Playwright browsers are cached separately; on cache miss they
#     download (~150 MB, ~30 s).
#   - The Vite dev server is auto-started by Playwright's `webServer`
#     config, so no extra step needed.
#   - On failure, upload the Playwright report + screenshots so a
#     contributor can debug without re-running locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when a new commit is
# pushed — keeps queue free and avoids wasting minutes on stale code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler 4.x requires Node ≥22; sticking with 20 fails worker
          # integration tests at "Wrangler requires at least Node.js v22".
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (worker)
        # Worker has its own package.json; integration tests + the
        # e2e webServer rely on the wrangler binary inside worker/.
        run: cd worker && npm install --no-save

      - name: Lint (ESLint)
        # Fails on `error`-level rules only; warnings (e.g. exhaustive-
        # deps that are intentionally suppressed) don't block the build.
        run: npm run lint

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (worker)
        run: cd worker && npm run typecheck

      - name: Build (root)
        # VITE_API_BASE must be set at build time — Vite inlines it
        # via import.meta.env.VITE_API_BASE into the production
        # bundle. Missing → relative /api/* fetches resolve against
        # openmakruk.com → SPA fallback returns HTML → JSON parse
        # errors in every cloud-sync section. Pinned here so CI
        # builds always carry it; the Cloudflare Pages "Connect to
        # Git" build needs the same env var set in its own dashboard.
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://openmakruk-api.cnatthaphon.workers.dev' }}
        run: npm run build

      - name: Worker integration tests
        # Apply the local D1 schema and run the vitest suite against a
        # wrangler dev spawned by the test's globalSetup.
        run: cd worker && npm run db:reset:local && npm run test

      # Cache Playwright browser binaries by version so subsequent runs
      # skip the ~150 MB download. The key embeds the @playwright/test
      # version from package-lock, so an upgrade naturally busts the
      # cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      # Always upload the test report — green or red — so reviewers
      # can inspect timings and (on red) the trace.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Deploy frontend to Cloudflare Pages — only on push to main,
      # and only if everything above passed (default step-conditional
      # behavior). PR builds do not deploy. The `dist/` directory is
      # already produced by the Build step earlier in this job.
      #
      # Requires repo secrets:
      #   CLOUDFLARE_API_TOKEN — token with Pages:Edit permission
      #   CLOUDFLARE_ACCOUNT_ID — account id for openmakruk-api
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-dirty=true silences the "working directory has
          # uncommitted changes" warning (CI sometimes produces stray
          # files during build/install). --commit-message overrides the
          # default `git log -1 --format=%B` with an ASCII-safe summary
          # — Cloudflare's deploy API rejected a previous commit with
          # `Invalid commit message, it must be a valid UTF-8 string`
          # even though the git-side bytes were valid UTF-8 (suspect:
          # encoding mismatch in the API client). Using github.sha keeps
          # the deploy traceable to a commit while sidestepping the
          # rejection. --commit-hash provides the SHA explicitly.
          command: pages deploy dist --project-name openmakruk --branch main --commit-dirty=true --commit-hash=${{ github.sha }} --commit-message="deploy ${{ github.sha }}"
